name: Building CI Pipeline
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set Up Node.js 
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install Dependencies
        run: npm install

      - name: Run test
        run: npm test
          